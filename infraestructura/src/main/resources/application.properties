server.port=${PORT:3001}
spring.main.banner-mode=off

# Fotos de perfil: hasta 5 MB. El swallow permite responder el error en vez de cortar la conexión.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=-1

spring.web.resources.add-mappings=false

# Hilos virtuales (Java 21) para atender peticiones: casi todo el tiempo de una petición
# se va esperando a otros servicios por gRPC, y un hilo virtual que espera no ocupa
# un hilo del sistema operativo.
spring.threads.virtual.enabled=true
