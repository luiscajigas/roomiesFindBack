syntax = "proto3";

package roomiesfind.moderacion;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.roomiesfind.contratos.moderacion";

// Bloqueos, reportes y alertas de cuentas muy reportadas.
service Moderacion {
  rpc Bloquear(ParejaRequest) returns (google.protobuf.Empty);
  rpc Desbloquear(ParejaRequest) returns (google.protobuf.Empty);
  // Personas que este usuario bloqueó.
  rpc ListarBloqueados(UsuarioRequest) returns (IdsResponse);
  // Personas que no debe ver: las que bloqueó y las que lo bloquearon.
  rpc ListarExcluidos(UsuarioRequest) returns (IdsResponse);
  rpc EstanBloqueados(ParejaRequest) returns (EstanBloqueadosResponse);
  rpc Reportar(ReportarRequest) returns (ReportarResponse);
  // De estas cuentas, las que tienen alerta activa.
  rpc CuentasConAlerta(CuentasRequest) returns (IdsResponse);

  // Panel de administración.
  rpc ObtenerResumen(google.protobuf.Empty) returns (ResumenModeracion);
  rpc ListarReportes(ListarReportesRequest) returns (ListarReportesResponse);
  // "descartar" quita la alerta; "mantener" la deja. En los dos casos los reportes quedan revisados.
  rpc ResolverReportes(ResolverReportesRequest) returns (google.protobuf.Empty);
  rpc Suspender(SuspenderRequest) returns (google.protobuf.Empty);
  rpc Reactivar(UsuarioRequest) returns (google.protobuf.Empty);
  rpc ListarSuspendidas(google.protobuf.Empty) returns (ListarSuspendidasResponse);
  rpc EstaSuspendida(UsuarioRequest) returns (EstaSuspendidaResponse);
}

message ParejaRequest {
  int32 usuario_id = 1;
  int32 otro_id = 2;
}

message UsuarioRequest {
  int32 usuario_id = 1;
}

message CuentasRequest {
  repeated int32 ids = 1;
}

message IdsResponse {
  repeated int32 ids = 1;
}

message EstanBloqueadosResponse {
  bool bloqueados = 1;
}

message ReportarRequest {
  int32 reportante_id = 1;
  int32 reportado_id = 2;
  string motivo = 3;
  string detalle = 4;
}

message ResumenModeracion {
  int32 cuentas_por_revisar = 1;
  int32 reportes_pendientes = 2;
  int32 alertas_activas = 3;
  int32 cuentas_suspendidas = 4;
}

message ListarReportesRequest {
  bool solo_pendientes = 1;
}

message Reporte {
  int64 id = 1;
  int32 reportante_id = 2;
  string motivo = 3;
  optional string detalle = 4;
  string estado = 5;
  string creado_en = 6;
}

message CuentaReportada {
  int32 usuario_id = 1;
  repeated Reporte reportes = 2;
  bool alerta = 3;
  bool suspendida = 4;
}

message ListarReportesResponse {
  repeated CuentaReportada cuentas = 1;
}

message ResolverReportesRequest {
  int32 admin_id = 1;
  int32 usuario_id = 2;
  string decision = 3;
}

message SuspenderRequest {
  int32 admin_id = 1;
  int32 usuario_id = 2;
  string motivo = 3;
}

message Suspension {
  int32 usuario_id = 1;
  string motivo = 2;
  optional int32 suspendida_por = 3;
  string creada_en = 4;
}

message ListarSuspendidasResponse {
  repeated Suspension suspensiones = 1;
}

message EstaSuspendidaResponse {
  bool suspendida = 1;
}

message ReportarResponse {
  // Solo es true para el reporte que hizo llegar la cuenta al límite.
  bool alerta_activada = 1;
}
